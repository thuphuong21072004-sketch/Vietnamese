
<div class="speak-page">

    <div class="background-circle circle-1"></div>
    <div class="background-circle circle-2"></div>

    <div class="speak-container">

        <div class="top-section">
            <div class="logo-box">
                <div class="logo-icon">🔊</div>
            </div>
            <h1>Speaking Practice</h1>
            <p class="subtitle">Enter English or Vietnamese to translate and listen to pronunciation</p>
        </div>

        <div class="translate-card">

            <div class="translate-row">

                <div class="language-box">
                    <div class="language-header">
                        <span class="language-flag">🇬🇧</span>
                        <span class="language-title">English</span>
                    </div>
                    <div class="input-wrapper">
                        <button class="icon-speak-btn"
                            (click)="speakText(englishText, 'en-US')"
                            [disabled]="!englishText"
                            title="Listen in English">
                            🔊
                        </button>
                        <input type="text" [(ngModel)]="englishText"
                            (input)="onEnglishInput(englishText)"
                            (keyup.enter)="translateFromEnglish()"
                            placeholder="Type in English..." />
                    </div>
                </div>

                <div class="swap-area">
                    <button class="swap-btn" (click)="clearAll()" title="Clear all">
                        ✕
                    </button>
                    <div class="swap-icon">⇄</div>
                </div>

                <div class="language-box">
                    <div class="language-header">
                        <span class="language-flag">🇻🇳</span>
                        <span class="language-title">Tiếng Việt</span>
                    </div>
                    <div class="input-wrapper">
                        <button class="icon-speak-btn vi-speak"
                            (click)="speakVietnamese()"
                            [disabled]="!vietnameseText || isSpeakingVi"
                            [class.playing]="isSpeakingVi"
                            title="Listen in Vietnamese">
                            {{ isSpeakingVi ? '⏳' : '🔊' }}
                        </button>
                        <input type="text" [(ngModel)]="vietnameseText"
                            (input)="onVietnameseInput(vietnameseText)"
                            (keyup.enter)="translateFromVietnamese()"
                            placeholder="Type in Vietnamese..." />
                    </div>
                </div>

            </div>

            <div class="loading-section" *ngIf="isLoading">
                <div class="loader"></div>
                <p>Translating...</p>
            </div>

        </div>

    </div>

</div>
