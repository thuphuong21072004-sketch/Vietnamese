<div class="level-container">

    <div class="header">
        <h2>Level Management</h2>
        <p class="subtitle">Create and manage levels used by courses</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Active</th>
                <th>Delete</th>
                <th>Select</th>
            </tr>
        </thead>

        <tbody>

            <tr *ngFor="let level of levels" [ngClass]="{ 'deleted-row': level.isDelete }">
                <td>
                    <input [(ngModel)]="level.levelName" [disabled]="level.isDelete" />
                </td>      
                <td>
                    <input [(ngModel)]="level.description" [disabled]="level.isDelete" />
                </td>
                <td>
                    <input type="checkbox" [(ngModel)]="level.isActive" />
                </td>
                <td>
                    <input type="checkbox" [(ngModel)]="level.isDelete" />
                </td>
                <td>
                    <a [routerLink]="['/admin/courses']" [queryParams]="{ levelId: level.levelId }" (click)="selectLevel(level)">
                        ➡
                    </a>
                </td>
            </tr>

        </tbody>
    </table>

    <div class="button-row">
      <button (click)="addRow()">Add new row</button>
      <button (click)="saveAll()">Save All</button>
    </div>

</div>
