<div class="page">

  <div class="page-header">
    <h1>Pending Bank Transfers</h1>
    <p>Review and confirm payments made via bank transfer</p>
  </div>

  <div *ngIf="loading" class="loading">Loading...</div>

  <div *ngIf="!loading && payments.length === 0" class="empty">
    No pending bank transfers.
  </div>

  <div *ngIf="!loading && payments.length > 0" class="table-card">

    <table>
      <thead>
        <tr>
          <th>Payment ID</th>
          <th>Type</th>
          <th>Ref ID</th>
          <th>Amount (USD)</th>
          <th>Submitted At</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of payments">
          <td>#{{ p.paymentId }}</td>
          <td>
            <span class="badge" [class.class-badge]="p.refName === 'CLASS'">
              {{ getRefLabel(p.refName) }}
            </span>
          </td>
          <td>#{{ p.refId }}</td>
          <td><strong>${{ p.amount }}</strong></td>
          <td>{{ p.createdDate | date:'dd/MM/yyyy HH:mm' }}</td>
          <td>
            <button
              class="confirm-btn"
              [disabled]="confirming === p.paymentId"
              (click)="confirm(p.paymentId)">
              {{ confirming === p.paymentId ? 'Confirming...' : 'Confirm Payment' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>

  </div>

</div>
