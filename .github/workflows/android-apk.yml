# Build app Android (APK) miễn phí trên GitHub Actions — không cần cài Android SDK lên máy.
# Mỗi lần push lên main có sửa Mobile/ (hoặc service dùng chung trong Fontend) → build lại và đăng lên
#   https://github.com/thuphuong21072004-sketch/Vietnamese/releases/download/android-latest/vietphuong.apk
# App gọi API ở địa chỉ ghi trong Mobile/src/environments/environment.device.ts (máy chạy backend, qua ts.net).
#
# Ký app cố định (để bản mới cài đè lên bản cũ): thêm 4 secret trong Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Chưa có secret → vẫn build được nhưng ký bằng khóa debug tạm (mỗi bản mới phải gỡ app cũ trước khi cài).

name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'Mobile/**'
      - 'Fontend/src/app/features/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Mobile/package-lock.json

      - name: Cài package
        working-directory: Mobile
        run: npm ci

      - name: Build giao diện cho app (API = environment.device.ts)
        working-directory: Mobile
        run: npm run build:device

      - name: Đồng bộ vào project Android
        working-directory: Mobile
        run: npx cap sync android

      - name: Khóa ký app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vietphuong.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/vietphuong.jks" >> "$GITHUB_ENV"
            echo "Dùng khóa ký cố định từ GitHub Secrets."
          else
            echo "::warning::Chưa có secret ANDROID_KEYSTORE_BASE64 → APK ký bằng khóa debug tạm; cài bản mới phải gỡ app cũ trước."
          fi

      - name: Build APK
        working-directory: Mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/vietphuong.apk"

      - name: Lưu APK (tải ở trang của lần chạy này)
        uses: actions/upload-artifact@v4
        with:
          name: vietphuong-apk-${{ github.run_number }}
          path: vietphuong.apk

      - name: Đăng lên link tải cố định (Releases → android-latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: VietPhuong Android (bản mới nhất)
          body: |
            Bản build tự động #${{ github.run_number }} từ commit ${{ github.sha }}.
            Cài đặt: tải vietphuong.apk trên điện thoại Android → mở file → cho phép "Cài ứng dụng không rõ nguồn gốc" → Cài đặt.
            Máy chạy backend + Tailscale phải đang bật thì app mới dùng được.
          files: vietphuong.apk
          overwrite_files: true
          make_latest: true
