<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teacher Applications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}*::-webkit-scrollbar{display:none}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, 'Segoe UI', Arial, sans-serif; color: #0f172a; background: linear-gradient(180deg, #f8fbff, #eef5ff)">
  <div style="height: {{top}}px; flex-shrink: 0"></div>
  <header style="flex-shrink: 0; padding: 4px 16px 10px">
    <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #4338ca">Admin Dashboard</span>
    <h1 style="margin: 2px 0 0; font-size: {{lts}}px; font-weight: 800; letter-spacing: -0.03em">Teacher Profiles</h1>
    <p style="margin: 2px 0 0; font-size: 13px; color: #64748b">Review and manage teacher applications.</p>
  </header>
  <div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <div role="tablist" style="display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button type="button" role="tab" style="flex-shrink: 0; height: 32px; padding: 0 10px; border-radius: 999px; border: 1.5px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font: 600 12px Inter, sans-serif">{{c.l}}</button>
      </sc-for>
    </div>
    <sc-for list="{{apps}}" as="a" hint-placeholder-count="3">
      <div style="background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 4px 15px rgba(15,23,42,.06); display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; gap: 12px; align-items: center">
          <div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #6366f1); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px">{{a.ini}}</div>
          <div style="flex: 1; min-width: 0"><p style="margin: 0; font-size: 15px; font-weight: 700">{{a.name}}</p><p style="margin: 2px 0 0; font-size: 12px; color: #64748b">{{a.country}} · <span style="color: #92400e; font-weight: 700">★ {{a.rate}}</span> · {{a.rev}} Reviews</p></div>
          <span style="flex-shrink: 0; padding: 4px 10px; border-radius: 999px; background: {{a.sbg}}; color: {{a.sfg}}; font-size: 11px; font-weight: 700">{{a.st}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: #f8fafc; border-radius: 12px; padding: 10px">
          <div><p style="margin: 0; font-size: 11px; color: #64748b; font-weight: 600">Experience</p><p style="margin: 2px 0 0; font-size: 14px; font-weight: 700">{{a.exp}}</p></div>
          <div><p style="margin: 0; font-size: 11px; color: #64748b; font-weight: 600">Desired</p><p style="margin: 2px 0 0; font-size: 14px; font-weight: 700">{{a.des}}</p></div>
          <div><p style="margin: 0; font-size: 11px; color: #64748b; font-weight: 600">Approved</p><p style="margin: 2px 0 0; font-size: 14px; font-weight: 700">{{a.app}}</p></div>
        </div>
        <a href="#" style="height: 44px; border-radius: 12px; border: 1px solid rgba(99,102,241,.18); background: #eef2ff; color: #4338ca; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">View Detail</a>
      </div>
    </sc-for>
  </div>
  <nav aria-label="Main" style="flex-shrink: 0; display: flex; background: rgba(255,255,255,.97); border-top: 1px solid rgba(15,23,42,.08); padding: 8px 4px {{tabPad}}px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="flex: 1; min-height: {{tabH}}px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.c}}; font-size: 11px; font-weight: {{t.fw}}">
        <span style="width: {{t.pw}}px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: {{t.bg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>
        <span>{{t.l}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const A = this.props.platform === 'android';
    const I = {
      fin: 'M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',
      users: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      content: 'M12 2 2 7l10 5 10-5zM2 17l10 5 10-5M2 12l10 5 10-5',
      teachers: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4',
      more: 'M4 6h16M4 12h16M4 18h16'
    };
    const T = [['fin', 'Finance', 'AdminFinance.dc.html'], ['users', 'Users', 'AdminUsers.dc.html'], ['content', 'Content', 'ContentMgmt.dc.html'], ['teachers', 'Teachers', 'TeacherApps.dc.html'], ['more', 'More', 'Profile.dc.html']];
    const act = 'teachers';
    const ST = { Submitted: ['#fef3c7', '#92400e'], 'Approved By Admin': ['#dbeafe', '#1d4ed8'], 'Approved Teacher': ['#dcfce7', '#166534'], Banned: ['#111827', '#fff'] };
    return {
      w: A ? 412 : 390, h: A ? 915 : 844, top: A ? 28 : 50, lts: A ? 24 : 28, tabH: A ? 56 : 44, tabPad: A ? 12 : 30,
      tabs: T.map(([k, l, href]) => { const on = k === act; return { l, href, d: I[k], c: on ? '#7c3aed' : '#64748b', fw: on ? 700 : 600, bg: on && A ? '#ede9fe' : 'transparent', pw: A ? 60 : 32 }; }),
      chips: ['All', 'Submitted', 'Approved Admin', 'Rejected Admin', 'Approved Teacher', 'Rejected Teacher', 'Banned'].map((l, i) => ({ l, bg: i === 1 ? '#7c3aed' : '#fff', fg: i === 1 ? '#fff' : '#64748b', bd: i === 1 ? '#7c3aed' : '#e2e8f0' })),
      apps: [
        ['T', 'Võ Thanh Tâm', 'Vietnam', '—', '0', 'Submitted', '3 yrs', '$14', '—'],
        ['L', 'Đặng Lan', 'Vietnam', '—', '0', 'Submitted', '6 yrs', '$20', '—'],
        ['H', 'Nguyễn Thu Hà', 'Vietnam', '4.9', '128', 'Approved Teacher', '5 yrs', '$15', '$15']
      ].map(([ini, name, country, rate, rev, st, exp, des, app]) => ({ ini, name, country, rate, rev, st, exp, des, app, sbg: ST[st][0], sfg: ST[st][1] }))
    };
  }
}
</script>
</body>
</html>
