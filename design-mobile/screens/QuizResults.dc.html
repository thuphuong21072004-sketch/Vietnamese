<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiz Results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}*::-webkit-scrollbar{display:none}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, 'Segoe UI', Arial, sans-serif; color: #0f172a; background: #f8fafc">
  <div style="height: {{top}}px; flex-shrink: 0; background: #1e3a8a"></div>
  <header style="flex-shrink: 0; background: #1e3a8a; color: #fff; display: flex; align-items: center; padding: 6px 10px 12px; gap: 8px">
    <a href="LearningPath.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #fff"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
    <h1 style="margin: 0; flex: 1; text-align: {{ta}}; font-family: 'Times New Roman', serif; font-size: 22px; font-weight: 700">Your Results</h1>
    <span style="width: 44px"></span>
  </header>
  <div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <section style="background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.06)">
      <p style="margin: 0; font-family: 'Times New Roman', serif; font-size: 16px; color: #475569">Unit 4 · Ordering food</p>
      <p style="margin: 0; font-family: 'Times New Roman', serif; font-size: 56px; font-weight: 700; color: #1e3a8a; line-height: 1">86%</p>
      <span style="padding: 6px 16px; border-radius: 999px; background: #dcfce7; color: #166534; font-size: 14px; font-weight: 800; letter-spacing: .06em">PASSED</span>
      <p style="margin: 4px 0 0; font-size: 13px; color: #64748b">Pass Score: 70% · Next unit unlocked</p>
    </section>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #fff; border-radius: 16px; padding: 16px; border-left: 4px solid #16a34a; box-shadow: 0 4px 16px rgba(0,0,0,.06)"><p style="margin: 0; font-size: 13px; color: #6b7280; font-weight: 600">Correct Answers</p><p style="margin: 6px 0 0; font-size: 28px; font-weight: 800; color: #15803d">13</p></div>
      <div style="background: #fff; border-radius: 16px; padding: 16px; border-left: 4px solid #dc2626; box-shadow: 0 4px 16px rgba(0,0,0,.06)"><p style="margin: 0; font-size: 13px; color: #6b7280; font-weight: 600">Wrong Answers</p><p style="margin: 6px 0 0; font-size: 28px; font-weight: 800; color: #b91c1c">2</p></div>
      <div style="background: #fff; border-radius: 16px; padding: 16px; border-left: 4px solid #f59e0b; box-shadow: 0 4px 16px rgba(0,0,0,.06)"><p style="margin: 0; font-size: 13px; color: #6b7280; font-weight: 600">Skipped</p><p style="margin: 6px 0 0; font-size: 28px; font-weight: 800; color: #92400e">0 Câu</p></div>
      <div style="background: #fff; border-radius: 16px; padding: 16px; border-left: 4px solid #2563eb; box-shadow: 0 4px 16px rgba(0,0,0,.06)"><p style="margin: 0; font-size: 13px; color: #6b7280; font-weight: 600">Score</p><p style="margin: 6px 0 0; font-size: 28px; font-weight: 800; color: #1e40af">26/30</p></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <a href="LearningPath.dc.html" style="height: 52px; border-radius: 14px; background: linear-gradient(135deg, #7c6cff, #4f46e5); color: #fff; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(124,108,255,.3)">Continue</a>
      <button type="button" style="height: 50px; border-radius: 14px; border: 1px solid rgba(99,102,241,.18); background: #eef2ff; color: #4338ca; font: 700 15px Inter, sans-serif">Review Answers</button>
      <div style="display: flex; gap: 10px">
        <button type="button" style="flex: 1; height: 48px; border-radius: 12px; border: 1px solid rgba(15,23,42,.1); background: #fff; color: #334155; font: 700 15px Inter, sans-serif">Try Again</button>
        <a href="LearningPath.dc.html" style="flex: 1; height: 48px; border-radius: 12px; border: 1px solid #cbd5e1; background: #f1f5f9; color: #475569; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Back to Units</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const A = this.props.platform === 'android';
    return { w: A ? 412 : 390, h: A ? 915 : 844, top: A ? 28 : 50, ta: A ? 'left' : 'center' };
  }
}
</script>
</body>
</html>
