<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Class Detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}*::-webkit-scrollbar{display:none}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, 'Segoe UI', Arial, sans-serif; color: #0f172a; background: radial-gradient(circle at 0% 0%, rgba(124,108,255,.14), transparent 40%), radial-gradient(circle at 100% 100%, rgba(56,189,248,.12), transparent 40%), linear-gradient(180deg, #f3f0ff, #faf8ff 50%, #f5f3ff)">
  <div style="height: {{top}}px; flex-shrink: 0"></div>
  <header style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 6px; height: {{barH}}px">
    <a href="GroupClasses.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5a2db5"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{backD}}"></path></svg></a>
    <h1 style="margin: 0; flex: 1; text-align: {{ta}}; font-size: {{dts}}px; font-weight: 700">Class Detail</h1>
    <span style="width: 44px"></span>
  </header>
  <div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: #e0e7ff; color: #4338ca; font-size: 12px; font-weight: 700">Upcoming</span>
      <h2 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em">Daily Conversation A1</h2>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #475569">Small-group speaking practice for everyday situations: greetings, shopping, directions and food.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid rgba(99,102,241,.18); background: #eef2ff; color: #4338ca; font: 700 14px Inter, sans-serif; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">View Teacher Information<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
      <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid rgba(99,102,241,.18); background: #eef2ff; color: #4338ca; font: 700 14px Inter, sans-serif; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">View Teacher Reviews<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>
    <section style="background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 4px 15px rgba(15,23,42,.06); display: flex; flex-direction: column; gap: 10px">
      <h3 style="margin: 0; font-size: 16px; font-weight: 700; color: #111827">Course Information</h3>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{info}}" as="r" hint-placeholder-count="8">
          <div style="background: #f8fafc; border-radius: 10px; padding: 8px 10px"><p style="margin: 0; font-size: 11px; font-weight: 600; color: #64748b">{{r.k}}</p><p style="margin: 2px 0 0; font-size: 14px; font-weight: 700">{{r.v}}</p></div>
        </sc-for>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h3 style="margin: 0; font-size: 16px; font-weight: 700; color: #111827">Course Curriculum</h3>
      <sc-for list="{{sessions}}" as="s" hint-placeholder-count="4">
        <div style="background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.04); display: flex; align-items: center; gap: 12px; opacity: {{s.op}}">
          <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #f5f3ff; color: #5a2db5; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">{{s.n}}</span>
          <div style="flex: 1; min-width: 0"><p style="margin: 0; font-size: 14px; font-weight: 700">{{s.topic}}</p><p style="margin: 2px 0 0; font-size: 12px; color: #64748b">{{s.date}} · 19:00 – 20:00</p></div>
        </div>
      </sc-for>
    </section>
  </div>
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 12px 16px {{bot}}px; background: rgba(255,255,255,.97); border-top: 1px solid rgba(15,23,42,.08)">
    <div><p style="margin: 0; font-size: 12px; color: #64748b">10 sessions</p><p style="margin: 0; font-size: 20px; font-weight: 800">$240</p></div>
    <a href="Payment.dc.html" style="flex: 1; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #7c6cff, #4f46e5); color: #fff; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(124,108,255,.3)">Enroll Now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const A = this.props.platform === 'android';
    return {
      w: A ? 412 : 390, h: A ? 915 : 844, top: A ? 28 : 50, bot: A ? 16 : 34,
      barH: A ? 64 : 44, ta: A ? 'left' : 'center', dts: A ? 20 : 17, backD: A ? 'M19 12H5M12 19l-7-7 7-7' : 'M15 18l-6-6 6-6',
      info: [['Teacher', 'Nguyễn Thu Hà'], ['Country', 'Vietnam'], ['Rating', '★ 4.9'], ['Price', '$240'], ['Main Topic', 'Daily Communication'], ['Sub Topic', 'Shopping'], ['Students', '6 / 10'], ['Total Sessions', '10'], ['Study Time', '19:00 – 20:00']].map(([k, v]) => ({ k, v })),
      sessions: [['1', 'Greetings & introductions', 'Mon 02/11'], ['2', 'Numbers and prices', 'Wed 04/11'], ['3', 'At the market', 'Fri 06/11'], ['4', 'Asking for directions', 'Mon 09/11']].map(([n, topic, date]) => ({ n, topic, date, op: 1 }))
    };
  }
}
</script>
</body>
</html>
