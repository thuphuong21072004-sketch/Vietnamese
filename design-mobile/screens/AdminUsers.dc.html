<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>User Management</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}*::-webkit-scrollbar{display:none}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, 'Segoe UI', Arial, sans-serif; color: #0f172a; background: linear-gradient(180deg, #f8fbff, #eef5ff)">
  <div style="height: {{top}}px; flex-shrink: 0"></div>
  <header style="flex-shrink: 0; padding: 4px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <div>
      <h1 style="margin: 0; font-size: {{lts}}px; font-weight: 800; letter-spacing: -0.03em">User Management</h1>
      <p style="margin: 2px 0 0; font-size: 13px; color: #64748b">Manage all users in the Vietnamese learning system</p>
    </div>
    <div style="display: flex; gap: 8px">
      <div style="flex: 1; min-width: 0; height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #e2e8f0; background: #fff; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #94a3b8">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>
        <label for="se" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search Email</label>
        <input id="se" type="search" placeholder="Search Email" style="flex: 1; min-width: 0; border: 0; outline: 0; font: 500 16px Inter, sans-serif; background: transparent">
      </div>
      <button type="button" aria-label="Filter by status and role" style="width: 46px; height: 46px; border-radius: 12px; border: 1px solid rgba(99,102,241,.18); background: #eef2ff; color: #4338ca; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></button>
    </div>
  </header>
  <div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{users}}" as="u" hint-placeholder-count="3">
      <div style="background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 4px 15px rgba(15,23,42,.06); display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; gap: 10px; align-items: center">
          <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #6366f1); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800">{{u.ini}}</div>
          <div style="flex: 1; min-width: 0"><p style="margin: 0; font-size: 15px; font-weight: 700">{{u.name}}</p><p style="margin: 1px 0 0; font-size: 12px; color: #64748b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{u.email}} · {{u.country}}</p></div>
          <span style="font-size: 12px; font-weight: 700; color: #94a3b8">#{{u.n}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) auto; gap: 8px; align-items: end">
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><label for="{{u.sid}}" style="font-size: 11px; font-weight: 600; color: #64748b">Status</label><select id="{{u.sid}}" style="height: 44px; border-radius: 10px; border: 1px solid #e2e8f0; padding: 0 8px; font: 600 14px Inter, sans-serif; background: #fff; color: {{u.sc}}; min-width: 0"><option>{{u.status}}</option></select></div>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><label for="{{u.rid}}" style="font-size: 11px; font-weight: 600; color: #64748b">Role</label><select id="{{u.rid}}" style="height: 44px; border-radius: 10px; border: 1px solid #e2e8f0; padding: 0 8px; font: 600 14px Inter, sans-serif; background: #fff; min-width: 0"><option>{{u.role}}</option></select></div>
          <button type="button" style="height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff; font: 700 14px Inter, sans-serif">Save</button>
        </div>
      </div>
    </sc-for>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 4px">
      <button type="button" disabled style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff; font: 700 13px Inter, sans-serif; opacity: .55">Prev</button>
      <span style="font-size: 13px; font-weight: 700; color: #334155">Page 1 / 12</span>
      <button type="button" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff; font: 700 13px Inter, sans-serif">Next</button>
    </div>
  </div>
  <nav aria-label="Main" style="flex-shrink: 0; display: flex; background: rgba(255,255,255,.97); border-top: 1px solid rgba(15,23,42,.08); padding: 8px 4px {{tabPad}}px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="flex: 1; min-height: {{tabH}}px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.c}}; font-size: 11px; font-weight: {{t.fw}}">
        <span style="width: {{t.pw}}px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: {{t.bg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>
        <span>{{t.l}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const A = this.props.platform === 'android';
    const I = {
      fin: 'M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',
      users: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      content: 'M12 2 2 7l10 5 10-5zM2 17l10 5 10-5M2 12l10 5 10-5',
      teachers: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4',
      more: 'M4 6h16M4 12h16M4 18h16'
    };
    const T = [['fin', 'Finance', 'AdminFinance.dc.html'], ['users', 'Users', 'AdminUsers.dc.html'], ['content', 'Content', 'ContentMgmt.dc.html'], ['teachers', 'Teachers', 'TeacherApps.dc.html'], ['more', 'More', 'Profile.dc.html']];
    const act = 'users';
    const U = [['1', 'L', 'Linh Tran', 'linh@example.com', 'Vietnam', 'Active', 'User'], ['2', 'H', 'Nguyễn Thu Hà', 'ha.nguyen@example.com', 'Vietnam', 'Active', 'Teacher'], ['3', 'M', 'Mark Evans', 'mark.e@example.com', 'Australia', 'Inactive', 'User'], ['4', 'P', 'Phạm Quốc Bảo', 'bao.pham@example.com', 'Vietnam', 'Active', 'Moderator']];
    return {
      w: A ? 412 : 390, h: A ? 915 : 844, top: A ? 28 : 50, lts: A ? 24 : 28, tabH: A ? 56 : 44, tabPad: A ? 12 : 30,
      tabs: T.map(([k, l, href]) => { const on = k === act; return { l, href, d: I[k], c: on ? '#7c3aed' : '#64748b', fw: on ? 700 : 600, bg: on && A ? '#ede9fe' : 'transparent', pw: A ? 60 : 32 }; }),
      users: U.map(([n, ini, name, email, country, status, role]) => ({ n, ini, name, email, country, status, role, sid: 'st' + n, rid: 'ro' + n, sc: status === 'Active' ? '#15803d' : '#b91c1c' }))
    };
  }
}
</script>
</body>
</html>
