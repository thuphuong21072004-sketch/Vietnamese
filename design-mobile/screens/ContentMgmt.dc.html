<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Content Management</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}*::-webkit-scrollbar{display:none}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, 'Segoe UI', Arial, sans-serif; color: #0f172a; background: linear-gradient(180deg, #f8fbff, #eef5ff)">
  <div style="height: {{top}}px; flex-shrink: 0"></div>
  <header style="flex-shrink: 0; padding: 4px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-size: {{lts}}px; font-weight: 800; letter-spacing: -0.03em">Course Management</h1>
    <nav aria-label="Content level" style="display: flex; padding: 4px; border-radius: 14px; background: #fff; border: 1px solid rgba(15,23,42,.08)">
      <a href="#" style="flex: 1; height: 40px; border-radius: 10px; color: #334155; font-size: 13px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Levels</a>
      <a href="#" aria-current="page" style="flex: 1; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #7c3aed, #6366f1); color: #fff; font-size: 13px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Courses</a>
      <a href="#" style="flex: 1; height: 40px; border-radius: 10px; color: #334155; font-size: 13px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Units</a>
    </nav>
  </header>
  <div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <section style="background: #f5f3ff; border-radius: 16px; padding: 14px">
      <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #4338ca">Level</span>
      <p style="margin: 2px 0 0; font-size: 17px; font-weight: 800">Level 1 · Everyday Basics</p>
      <p style="margin: 2px 0 0; font-size: 13px; color: #475569">Greetings, numbers, food and getting around.</p>
    </section>
    <sc-for list="{{courses}}" as="c" hint-placeholder-count="3">
      <div style="background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 4px 15px rgba(15,23,42,.06); display: flex; flex-direction: column; gap: 10px; opacity: {{c.op}}">
        <div style="display: flex; gap: 10px; align-items: flex-start">
          <div style="flex: 1; min-width: 0">
            <p style="margin: 0; font-size: 15px; font-weight: 700; text-decoration: {{c.td}}">{{c.name}}</p>
            <p style="margin: 2px 0 0; font-size: 12px; color: #64748b">{{c.desc}}</p>
            <p style="margin: 4px 0 0; font-size: 11px; color: #94a3b8">Created By {{c.by}}</p>
          </div>
          <a href="#" aria-label="Open units" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #eef2ff; color: #4338ca; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
        </div>
        <div style="display: flex; gap: 16px; border-top: 1px solid #f1f5f9; padding-top: 8px">
          <label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 13px; font-weight: 600; color: #334155"><input type="checkbox" checked="{{c.active}}" style="width: 20px; height: 20px; margin: 0; accent-color: #16a34a">Active</label>
          <label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 13px; font-weight: 600; color: #b91c1c"><input type="checkbox" checked="{{c.del}}" style="width: 20px; height: 20px; margin: 0; accent-color: #dc2626">Delete</label>
        </div>
      </div>
    </sc-for>
    <button type="button" style="height: 48px; border-radius: 12px; border: 2px dashed #d1d5db; background: transparent; color: #4338ca; font: 700 14px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add new row</button>
    <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid rgba(99,102,241,.18); background: #eef2ff; color: #4338ca; font: 700 14px Inter, sans-serif">Manage Level Quiz</button>
  </div>
  <div style="flex-shrink: 0; padding: 10px 16px; background: rgba(255,255,255,.97); border-top: 1px solid rgba(15,23,42,.08)">
    <button type="button" style="width: 100%; height: 48px; border-radius: 12px; border: 0; background: linear-gradient(135deg, #7c3aed, #6366f1); color: #fff; font: 700 15px Inter, sans-serif; box-shadow: 0 4px 12px rgba(124,108,255,.3)">Save All</button>
  </div>
  <nav aria-label="Main" style="flex-shrink: 0; display: flex; background: rgba(255,255,255,.97); border-top: 1px solid rgba(15,23,42,.08); padding: 8px 4px {{tabPad}}px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="flex: 1; min-height: {{tabH}}px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.c}}; font-size: 11px; font-weight: {{t.fw}}">
        <span style="width: {{t.pw}}px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: {{t.bg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>
        <span>{{t.l}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const A = this.props.platform === 'android';
    const I = {
      fin: 'M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',
      users: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      content: 'M12 2 2 7l10 5 10-5zM2 17l10 5 10-5M2 12l10 5 10-5',
      teachers: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4',
      more: 'M4 6h16M4 12h16M4 18h16'
    };
    const T = [['fin', 'Finance', 'AdminFinance.dc.html'], ['users', 'Users', 'AdminUsers.dc.html'], ['content', 'Content', 'ContentMgmt.dc.html'], ['teachers', 'Teachers', 'TeacherApps.dc.html'], ['more', 'More', 'Profile.dc.html']];
    const act = 'content';
    return {
      w: A ? 412 : 390, h: A ? 915 : 844, top: A ? 28 : 50, lts: A ? 24 : 28, tabH: A ? 56 : 44, tabPad: A ? 12 : 30,
      tabs: T.map(([k, l, href]) => { const on = k === act; return { l, href, d: I[k], c: on ? '#7c3aed' : '#64748b', fw: on ? 700 : 600, bg: on && A ? '#ede9fe' : 'transparent', pw: A ? 60 : 32 }; }),
      courses: [
        ['Greetings & Basics', 'First words and polite phrases', 'admin', true, false],
        ['Food & Drinks', 'Ordering, prices and paying', 'admin', true, false],
        ['Old Draft Course', 'Replaced by Food & Drinks', 'moderator', false, true]
      ].map(([name, desc, by, active, del]) => ({ name, desc, by, active, del, op: del ? 0.5 : 1, td: del ? 'line-through' : 'none' }))
    };
  }
}
</script>
</body>
</html>
