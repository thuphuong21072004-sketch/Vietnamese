<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speaking Practice</title>
<script src="./support.js"></script>
</head>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}*::-webkit-scrollbar{display:none}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, 'Segoe UI', Arial, sans-serif; color: #0f172a; background: radial-gradient(circle at 0% 0%, rgba(124,108,255,.14), transparent 40%), radial-gradient(circle at 100% 100%, rgba(56,189,248,.12), transparent 40%), linear-gradient(180deg, #f3f0ff, #faf8ff 50%, #f5f3ff)">
  <div style="height: {{top}}px; flex-shrink: 0"></div>
  <header style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 6px; height: {{barH}}px">
    <a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5a2db5"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{backD}}"></path></svg></a>
    <h1 style="margin: 0; flex: 1; text-align: {{ta}}; font-size: {{dts}}px; font-weight: 700">Speaking Practice</h1>
    <span style="width: 44px"></span>
  </header>
  <div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0; font-size: 14px; color: #64748b">Translate and practice Vietnamese pronunciation</p>
    <section style="background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 4px 15px rgba(15,23,42,.06); display: flex; flex-direction: column; gap: 8px">
      <div style="border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; justify-content: space-between"><label for="en" style="font-size: 12px; font-weight: 700; color: #64748b">English</label><button type="button" aria-label="Listen in English" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: #eef2ff; color: #4f46e5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"></path></svg></button></div>
        <textarea id="en" rows="2" style="border: 0; padding: 0; resize: none; font: 500 17px Inter, sans-serif; color: #0f172a">How much is this bowl of noodles?</textarea>
      </div>
      <div style="display: flex; justify-content: center; gap: 10px">
        <button type="button" aria-label="Clear" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(15,23,42,.08); background: #fff; color: #64748b; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        <button type="button" aria-label="Swap languages" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(15,23,42,.08); background: #fff; color: #4f46e5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16V4M3 8l4-4 4 4M17 8v12M21 16l-4 4-4-4"></path></svg></button>
      </div>
      <div style="border: 1px solid rgba(124,108,255,.3); background: #faf8ff; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; justify-content: space-between"><label for="vi" style="font-size: 12px; font-weight: 700; color: #5a2db5">Tiếng Việt</label><button type="button" aria-label="Listen in Vietnamese" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: #ede9fe; color: #6d28d9; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"></path></svg></button></div>
        <textarea id="vi" rows="2" style="border: 0; padding: 0; resize: none; background: transparent; font: 600 17px Inter, sans-serif; color: #0f172a">Bát phở này bao nhiêu tiền?</textarea>
      </div>
    </section>
    <section style="background: #fff; border-radius: 18px; padding: 18px 14px; box-shadow: 0 4px 15px rgba(15,23,42,.06); display: flex; flex-direction: column; align-items: center; gap: 12px">
      <div style="position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center">
        <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; background: rgba(239,68,68,.12)"></span>
        <span aria-hidden="true" style="position: absolute; inset: 14px; border-radius: 50%; background: rgba(239,68,68,.18)"></span>
        <button type="button" aria-label="Stop recording" style="position: relative; width: 84px; height: 84px; border-radius: 50%; border: 0; background: #ef4444; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(239,68,68,.35)"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h12v12H6z"></path></svg></button>
      </div>
      <p style="margin: 0; font-size: 13px; font-weight: 600; color: #dc2626">Đang nhận dạng giọng nói...</p>
      <div style="align-self: stretch; border-top: 1px solid #f1f5f9; padding-top: 12px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <div><p style="margin: 0; font-size: 12px; font-weight: 700; color: #64748b">You said:</p><p style="margin: 2px 0 0; font-size: 16px; font-weight: 600">Bát phở này bao nhiều tiền</p></div>
          <span style="padding: 6px 12px; border-radius: 999px; background: #fef3c7; color: #92400e; font-size: 13px; font-weight: 800; white-space: nowrap">72 · good</span>
        </div>
        <p style="margin: 0; font-size: 12px; font-weight: 700; color: #64748b">Pronunciation Score</p>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{words}}" as="x" hint-placeholder-count="6">
            <span style="padding: 6px 10px; border-radius: 8px; background: {{x.bg}}; color: {{x.fg}}; font-size: 16px; font-weight: 700; text-decoration: {{x.td}}">{{x.t}}</span>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px 12px">
          <sc-for list="{{legend}}" as="g" hint-placeholder-count="6">
            <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #475569"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{g.c}}"></span>{{g.t}}</span>
          </sc-for>
        </div>
      </div>
    </section>
  </div>
  <nav aria-label="Main" style="flex-shrink: 0; display: flex; background: rgba(255,255,255,.97); border-top: 1px solid rgba(15,23,42,.08); padding: 8px 4px {{tabPad}}px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="flex: 1; min-height: {{tabH}}px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.c}}; font-size: 11px; font-weight: {{t.fw}}">
        <span style="width: {{t.pw}}px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: {{t.bg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>
        <span>{{t.l}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
