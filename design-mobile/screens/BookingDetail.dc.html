<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Booking Detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}*::-webkit-scrollbar{display:none}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, 'Segoe UI', Arial, sans-serif; color: #0f172a; background: radial-gradient(circle at 0% 0%, rgba(124,108,255,.14), transparent 40%), radial-gradient(circle at 100% 100%, rgba(56,189,248,.12), transparent 40%), linear-gradient(180deg, #f3f0ff, #faf8ff 50%, #f5f3ff)">
  <div style="height: {{top}}px; flex-shrink: 0"></div>
  <header style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 6px; height: {{barH}}px">
    <a href="MyBookings.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5a2db5"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{backD}}"></path></svg></a>
    <h1 style="margin: 0; flex: 1; text-align: {{ta}}; font-size: {{dts}}px; font-weight: 700">Booking Detail</h1>
    <span style="width: 44px"></span>
  </header>
  <div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <section style="background: #fff; border-radius: 20px; padding: 16px; box-shadow: 0 4px 15px rgba(15,23,42,.06); display: flex; gap: 12px; align-items: center">
      <div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #6366f1); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px">Q</div>
      <div style="flex: 1; min-width: 0"><p style="margin: 0; font-size: 16px; font-weight: 800">Trần Minh Quân</p><p style="margin: 2px 0 0; font-size: 13px; color: #64748b">Business Vietnamese</p></div>
      <span style="padding: 4px 10px; border-radius: 999px; background: #dbeafe; color: #1d4ed8; font-size: 12px; font-weight: 700">In Progress</span>
    </section>
    <section style="border-radius: 20px; padding: 16px; background: #eef2ff; border: 1px solid rgba(99,102,241,.18); display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700; color: #3730a3">Online Class Room</h2>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #475569">Room Code</span><b style="letter-spacing: .06em">VP-8K2Q</b></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #475569">Expired At</span><b>21/10/2026 09:45</b></div>
      <a href="#" style="height: 50px; border-radius: 14px; background: linear-gradient(135deg, #7c6cff, #4f46e5); color: #fff; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(124,108,255,.3)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5zM1 5h15v14H1z"></path></svg>Join Room</a>
      <a href="#" style="align-self: center; min-height: 36px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #7c3aed; text-decoration: none">Open class room</a>
    </section>
    <section style="background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 4px 15px rgba(15,23,42,.06); display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0 0 6px; font-size: 16px; font-weight: 700; color: #111827">Booking Information</h2>
      <sc-for list="{{info}}" as="r" hint-placeholder-count="8">
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 34px; border-bottom: 1px solid #f1f5f9; font-size: 14px"><span style="color: #64748b">{{r.k}}</span><b style="text-align: right">{{r.v}}</b></div>
      </sc-for>
    </section>
    <section style="border-radius: 18px; padding: 16px; border: 2px dashed #d1d5db; text-align: center; display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #334155">Student Review</h2>
      <p style="margin: 0; font-size: 13px; color: #6b7280">Review is available after the class is completed.</p>
    </section>
  </div>
  <div style="flex-shrink: 0; padding: 12px 16px {{bot}}px; background: rgba(255,255,255,.97); border-top: 1px solid rgba(15,23,42,.08)">
    <button type="button" style="width: 100%; height: 50px; border-radius: 14px; border: 0; background: #fee2e2; color: #dc2626; font: 700 15px Inter, sans-serif">Cancel Booking</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const A = this.props.platform === 'android';
    return {
      w: A ? 412 : 390, h: A ? 915 : 844, top: A ? 28 : 50, bot: A ? 16 : 34,
      barH: A ? 64 : 44, ta: A ? 'left' : 'center', dts: A ? 20 : 17, backD: A ? 'M19 12H5M12 19l-7-7 7-7' : 'M15 18l-6-6 6-6',
      info: [['Booking ID', '#1038'], ['Booking Date', '18/10/2026'], ['Class Date', '21/10/2026'], ['Class Time', '08:30 – 09:30'], ['Duration', '1 hour'], ['Total Amount', '$18.00'], ['Payment Status', 'Paid'], ['Payment Method', 'Card (Stripe)'], ['Transaction Code', 'pi_3Q…8Fz']].map(([k, v]) => ({ k, v }))
    };
  }
}
</script>
</body>
</html>
