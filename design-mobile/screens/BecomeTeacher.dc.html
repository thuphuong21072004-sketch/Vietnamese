<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Become a Teacher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}*::-webkit-scrollbar{display:none}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, 'Segoe UI', Arial, sans-serif; color: #0f172a; background: radial-gradient(circle at 0% 0%, rgba(124,108,255,.14), transparent 40%), radial-gradient(circle at 100% 100%, rgba(56,189,248,.12), transparent 40%), linear-gradient(180deg, #f3f0ff, #faf8ff 50%, #f5f3ff)">
  <div style="height: {{top}}px; flex-shrink: 0"></div>
  <header style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 6px; height: {{barH}}px">
    <a href="Profile.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5a2db5"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{backD}}"></path></svg></a>
    <h1 style="margin: 0; flex: 1; text-align: {{ta}}; font-size: {{dts}}px; font-weight: 700">Become a Teacher</h1>
    <span style="width: 44px"></span>
  </header>
  <div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="border-radius: 16px; padding: 14px; background: #eef2ff; color: #4338ca; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 13px; font-weight: 700">Status:</span><span style="padding: 3px 10px; border-radius: 999px; background: #f3f4f6; color: #6b7280; font-size: 12px; font-weight: 700">Draft</span></div>
      <p style="margin: 0; font-size: 14px; line-height: 1.5">Complete your information and submit for review.</p>
    </div>
    <form style="background: #fff; border-radius: 20px; padding: 16px; box-shadow: 0 4px 15px rgba(15,23,42,.06); display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="sp" style="font-size: 13px; font-weight: 600; color: #334155">Specialty <span style="color: #dc2626">*</span></label>
        <input id="sp" type="text" value="Conversation &amp; pronunciation" style="height: 48px; box-sizing: border-box; border-radius: 10px; border: 1px solid #e2e8f0; padding: 0 14px; font: 500 16px Inter, sans-serif">
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="ex" style="font-size: 13px; font-weight: 600; color: #334155">Experience Years</label><input id="ex" type="number" value="5" style="height: 48px; box-sizing: border-box; border-radius: 10px; border: 1px solid #e2e8f0; padding: 0 14px; font: 500 16px Inter, sans-serif; min-width: 0"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="pr" style="font-size: 13px; font-weight: 600; color: #334155">Desired Price / Hour</label><input id="pr" type="number" value="15" style="height: 48px; box-sizing: border-box; border-radius: 10px; border: 1px solid #e2e8f0; padding: 0 14px; font: 500 16px Inter, sans-serif; min-width: 0"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="de" style="font-size: 13px; font-weight: 600; color: #334155">Description <span style="color: #dc2626">*</span></label>
        <textarea id="de" rows="4" placeholder="Tell students about your teaching style" style="box-sizing: border-box; border-radius: 10px; border: 1px solid #e2e8f0; padding: 12px 14px; font: 500 16px Inter, sans-serif; resize: none"></textarea>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; color: #334155">Introduction Video</span>
        <button type="button" style="min-height: 112px; border-radius: 14px; border: 2px dashed rgba(124,108,255,.35); background: #f8f6ff; color: #5a2db5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 600 14px Inter, sans-serif"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5zM1 5h15v14H1z"></path></svg>Upload a video<span style="font-size: 12px; font-weight: 500; color: #64748b">MP4 or MOV</span></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; color: #334155">English Certificate</span>
        <button type="button" style="height: 52px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; color: #334155; display: flex; align-items: center; gap: 10px; padding: 0 14px; font: 600 14px Inter, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>Choose file<span style="margin-left: auto; font-size: 12px; font-weight: 500; color: #94a3b8">.pdf .doc .jpg .png</span></button>
      </div>
    </form>
  </div>
  <div style="flex-shrink: 0; display: flex; gap: 10px; padding: 12px 16px {{bot}}px; background: rgba(255,255,255,.97); border-top: 1px solid rgba(15,23,42,.08)">
    <button type="button" style="flex: 1; height: 52px; border-radius: 14px; border: 1px solid rgba(99,102,241,.18); background: #eef2ff; color: #4338ca; font: 700 15px Inter, sans-serif">Create Profile</button>
    <button type="button" style="flex: 1; height: 52px; border-radius: 14px; border: 0; background: linear-gradient(135deg, #7c6cff, #4f46e5); color: #fff; font: 700 15px Inter, sans-serif; box-shadow: 0 4px 12px rgba(124,108,255,.3)">Submit Profile</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const A = this.props.platform === 'android';
    return { w: A ? 412 : 390, h: A ? 915 : 844, top: A ? 28 : 50, bot: A ? 16 : 34,
      barH: A ? 64 : 44, ta: A ? 'left' : 'center', dts: A ? 20 : 17, backD: A ? 'M19 12H5M12 19l-7-7 7-7' : 'M15 18l-6-6 6-6' };
  }
}
</script>
</body>
</html>
