<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Travel Requests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}*::-webkit-scrollbar{display:none}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, 'Segoe UI', Arial, sans-serif; color: #0f172a; background: radial-gradient(circle at 0% 0%, rgba(16,185,129,.12), transparent 40%), radial-gradient(circle at 100% 100%, rgba(56,189,248,.12), transparent 40%), linear-gradient(180deg, #f0fdf8, #faf8ff 50%, #f5f3ff)">
  <div style="height: {{top}}px; flex-shrink: 0"></div>
  <header style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 6px; height: {{barH}}px">
    <a href="TravelTrips.dc.html" aria-label="Back to My Trips" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #047857"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{backD}}"></path></svg></a>
    <h1 style="margin: 0; flex: 1; text-align: {{ta}}; font-size: {{dts}}px; font-weight: 700">Travel Requests</h1>
    <span style="width: 44px"></span>
  </header>
  <div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button type="button" style="flex-shrink: 0; height: 32px; padding: 0 10px; border-radius: 999px; border: 1.5px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font: 600 12px Inter, sans-serif">{{c.l}}</button>
      </sc-for>
    </div>
    <sc-for list="{{reqs}}" as="r" hint-placeholder-count="3">
      <div style="background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 4px 15px rgba(15,23,42,.06); display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 8px">
          <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #6366f1); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800">{{r.ini}}</div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16V4M3 8l4-4 4 4M17 8v12M21 16l-4 4-4-4"></path></svg>
          <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: #ecfdf5; color: #047857; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px">You</div>
          <div style="flex: 1; min-width: 0"><p style="margin: 0; font-size: 14px; font-weight: 700">{{r.name}}</p><p style="margin: 1px 0 0; font-size: 12px; color: #64748b">{{r.dir}}</p></div>
          <span style="flex-shrink: 0; padding: 4px 10px; border-radius: 999px; background: {{r.sbg}}; color: {{r.sfg}}; font-size: 12px; font-weight: 700">{{r.st}}</span>
        </div>
        <div style="display: flex; gap: 14px; font-size: 13px; color: #334155; background: #f8fafc; border-radius: 10px; padding: 8px 10px">
          <span style="display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0zM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg>{{r.place}}</span>
          <span>{{r.dates}}</span>
        </div>
        <div style="display: flex; gap: 8px">
          <button type="button" style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid rgba(15,23,42,.1); background: #fff; color: #334155; font: 700 14px Inter, sans-serif">View Profile</button>
          <sc-if value="{{r.recv}}" hint-placeholder-val="{{true}}">
            <button type="button" style="flex: 1; height: 44px; border-radius: 12px; border: 0; background: #fee2e2; color: #dc2626; font: 700 14px Inter, sans-serif">Reject</button>
            <button type="button" style="flex: 1; height: 44px; border-radius: 12px; border: 0; background: linear-gradient(135deg, #059669, #10b981); color: #fff; font: 700 14px Inter, sans-serif">Accept</button>
          </sc-if>
          <sc-if value="{{r.sent}}" hint-placeholder-val="{{false}}"><button type="button" style="flex: 1; height: 44px; border-radius: 12px; border: 0; background: #fee2e2; color: #dc2626; font: 700 14px Inter, sans-serif">Cancel</button></sc-if>
          <sc-if value="{{r.acc}}" hint-placeholder-val="{{false}}"><a href="ClassDetail.dc.html" style="flex: 1; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #059669, #10b981); color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">View Class Detail</a></sc-if>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const A = this.props.platform === 'android';
    const ST = { Pending: ['#fef3c7', '#92400e'], Accepted: ['#dcfce7', '#166534'], Rejected: ['#fee2e2', '#dc2626'] };
    const R = [
      ['T', 'Võ Thanh Tâm', 'Teacher invited you', 'Pending', 'Đà Nẵng', '28/11 – 05/12', 'recv'],
      ['L', 'Đặng Lan', 'You invited teacher', 'Pending', 'Huế', '12/12 – 15/12', 'sent'],
      ['H', 'Nguyễn Thu Hà', 'You invited teacher', 'Accepted', 'Hà Nội', '02/01 – 08/01', 'acc']
    ];
    return {
      w: A ? 412 : 390, h: A ? 915 : 844, top: A ? 28 : 50,
      barH: A ? 64 : 44, ta: A ? 'left' : 'center', dts: A ? 20 : 17, backD: A ? 'M19 12H5M12 19l-7-7 7-7' : 'M15 18l-6-6 6-6',
      chips: ['All Statuses', 'Pending', 'Accepted', 'Rejected', 'Cancelled'].map((l, i) => ({ l, bg: i === 0 ? '#059669' : '#fff', fg: i === 0 ? '#fff' : '#64748b', bd: i === 0 ? '#059669' : '#e2e8f0' })),
      reqs: R.map(([ini, name, dir, st, place, dates, k]) => ({ ini, name, dir, st, place, dates, sbg: ST[st][0], sfg: ST[st][1], recv: k === 'recv', sent: k === 'sent', acc: k === 'acc' }))
    };
  }
}
</script>
</body>
</html>
