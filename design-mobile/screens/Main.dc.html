<!doctype html>
<html lang="en">
<head>

<x-dc>

</helmet>
<div style="width: {{w}}px; height: {{h}}px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: Inter, 'Segoe UI', Arial, sans-serif; color: #fff; background: linear-gradient(160deg, #0f172a 0%, #1e293b 55%, #312e81 100%)">
  <div aria-hidden="true" style="position: absolute; width: 260px; height: 260px; border-radius: 50%; background: #7c3aed; opacity: .35; filter: blur(60px); top: -60px; left: -80px"></div>
  <div aria-hidden="true" style="position: absolute; width: 220px; height: 220px; border-radius: 50%; background: #2563eb; opacity: .3; filter: blur(60px); top: 280px; right: -90px"></div>
  <div aria-hidden="true" style="position: absolute; width: 200px; height: 200px; border-radius: 50%; background: #9333ea; opacity: .28; filter: blur(60px); bottom: -40px; left: 30px"></div>
  <div style="height: {{top}}px; flex-shrink: 0"></div>
  <div style="position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 24px 20px {{bot}}px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #7c3aed, #6366f1); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; box-shadow: 0 18px 40px rgba(124,108,255,.35)">VP</div>
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Welcome Back</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #cbd5e1">Continue your Vietnamese journey with lessons, tutors and pronunciation practice.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); font-size: 12px; font-weight: 600; color: #e2e8f0">Interactive Lessons</span>
        <span style="padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); font-size: 12px; font-weight: 600; color: #e2e8f0">Online Teacher Booking</span>
        <span style="padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); font-size: 12px; font-weight: 600; color: #e2e8f0">AI Pronunciation Practice</span>
      </div>
    </div>
    <form style="background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 24px; padding: 22px 18px; display: flex; flex-direction: column; gap: 16px; backdrop-filter: blur(18px)">
      <div>
        <h2 style="margin: 0; font-size: 22px; font-weight: 800">Login</h2>
        <p style="margin: 4px 0 0; font-size: 14px; color: #94a3b8">Sign in to your account</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="em" style="font-size: 13px; font-weight: 600; color: #cbd5e1">Email</label>
        <input id="em" type="email" placeholder="you@example.com" style="height: 50px; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #fff; padding: 0 14px; font: 500 16px Inter, sans-serif">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="pw" style="font-size: 13px; font-weight: 600; color: #cbd5e1">Password</label>
        <input id="pw" type="password" value="password" style="height: 50px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid #8b5cf6; box-shadow: 0 0 0 4px rgba(139,92,246,.2); background: rgba(255,255,255,.06); color: #fff; padding: 0 14px; font: 500 16px Inter, sans-serif">
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; color: #cbd5e1"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #7c3aed; margin: 0">Remember me</label>
        <a href="#" style="font-size: 14px; font-weight: 600; color: #a78bfa; text-decoration: none; min-height: 44px; display: flex; align-items: center">Forgot password?</a>
      </div>
      <button type="button" style="height: 52px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #7c3aed, #6366f1); color: #fff; font: 700 16px Inter, sans-serif; box-shadow: 0 18px 40px rgba(124,108,255,.3)">Login Account</button>
      <p style="margin: 0; text-align: center; font-size: 14px; color: #94a3b8">Don't have an account? <a href="Register.dc.html" style="color: #a78bfa; font-weight: 700; text-decoration: none">Create Account</a></p>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"$preview":{"width":390,"height":844}}'>

  renderVals() {
    const A = this.props.platform === 'android';
    return { w: A ? 412 : 390, h: A ? 915 : 844, top: A ? 28 : 50, bot: A ? 24 : 40 };
  }
}
</script>
</body>
</html>
