<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teacher Review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}*::-webkit-scrollbar{display:none}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, 'Segoe UI', Arial, sans-serif; color: #0f172a; background: radial-gradient(circle at 0% 0%, rgba(124,108,255,.14), transparent 40%), radial-gradient(circle at 100% 100%, rgba(56,189,248,.12), transparent 40%), linear-gradient(180deg, #f3f0ff, #faf8ff 50%, #f5f3ff)">
  <div style="height: {{top}}px; flex-shrink: 0"></div>
  <header style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 6px; height: {{barH}}px">
    <a href="MyBookings.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5a2db5"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{backD}}"></path></svg></a>
    <h1 style="margin: 0; flex: 1; text-align: {{ta}}; font-size: {{dts}}px; font-weight: 700">Teacher Review</h1>
    <span style="width: 44px"></span>
  </header>
  <div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <section style="background: #fff; border-radius: 20px; padding: 16px; box-shadow: 0 4px 15px rgba(15,23,42,.06); display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 12px; align-items: center">
        <div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #6366f1); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px">H</div>
        <div><p style="margin: 0; font-size: 16px; font-weight: 800">Nguyễn Thu Hà</p><p style="margin: 2px 0 0; font-size: 13px; color: #64748b">Conversation &amp; pronunciation</p></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; background: #f8fafc; border-radius: 12px; padding: 12px">
        <div><p style="margin: 0; font-size: 11px; font-weight: 600; color: #64748b">Class Date</p><p style="margin: 2px 0 0; font-size: 14px; font-weight: 700">14/10/2026</p></div>
        <div><p style="margin: 0; font-size: 11px; font-weight: 600; color: #64748b">Class Time</p><p style="margin: 2px 0 0; font-size: 14px; font-weight: 700">19:00 – 20:00</p></div>
        <div><p style="margin: 0; font-size: 11px; font-weight: 600; color: #64748b">Duration</p><p style="margin: 2px 0 0; font-size: 14px; font-weight: 700">1 hour</p></div>
        <div><p style="margin: 0; font-size: 11px; font-weight: 600; color: #64748b">Lesson Fee</p><p style="margin: 2px 0 0; font-size: 14px; font-weight: 700">$15.00</p></div>
      </div>
    </section>
    <form style="background: #fff; border-radius: 20px; padding: 16px; box-shadow: 0 4px 15px rgba(15,23,42,.06); display: flex; flex-direction: column; gap: 14px">
      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="font-size: 13px; font-weight: 600; color: #334155; padding: 0; margin-bottom: 8px">Rating</legend>
        <div style="display: flex; gap: 6px">
          <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
            <button type="button" aria-label="{{s.l}}" style="width: 52px; height: 52px; border-radius: 14px; border: 1px solid {{s.bd}}; background: {{s.bg}}; color: {{s.c}}; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"></path></svg></button>
          </sc-for>
        </div>
        <span style="font-size: 13px; font-weight: 700; color: #92400e">4 Stars</span>
      </fieldset>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="cm" style="font-size: 13px; font-weight: 600; color: #334155">Comment <span style="color: #dc2626">*</span></label>
        <textarea id="cm" rows="5" placeholder="Share what went well and what could be better" style="box-sizing: border-box; border-radius: 12px; border: 1px solid #e2e8f0; padding: 12px 14px; font: 500 16px Inter, sans-serif; resize: none">Clear explanations of tones, very patient.</textarea>
      </div>
    </form>
  </div>
  <div style="flex-shrink: 0; padding: 12px 16px {{bot}}px; background: rgba(255,255,255,.97); border-top: 1px solid rgba(15,23,42,.08)">
    <a href="MyBookings.dc.html" style="height: 52px; border-radius: 14px; background: linear-gradient(135deg, #7c6cff, #4f46e5); color: #fff; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(124,108,255,.3)">Submit Review</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const A = this.props.platform === 'android';
    return {
      w: A ? 412 : 390, h: A ? 915 : 844, top: A ? 28 : 50, bot: A ? 16 : 34,
      barH: A ? 64 : 44, ta: A ? 'left' : 'center', dts: A ? 20 : 17, backD: A ? 'M19 12H5M12 19l-7-7 7-7' : 'M15 18l-6-6 6-6',
      stars: [1, 2, 3, 4, 5].map((n) => ({ l: n + ' Star' + (n > 1 ? 's' : ''), c: n <= 4 ? '#f59e0b' : '#d1d5db', bg: n <= 4 ? '#fffbeb' : '#fff', bd: n <= 4 ? '#fde68a' : '#e5e7eb' }))
    };
  }
}
</script>
</body>
</html>
