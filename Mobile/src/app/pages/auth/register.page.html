<div class="blob" style="width: 240px; height: 240px; background: #7c3aed; opacity: 0.32; top: -70px; right: -60px"></div>
<div class="blob" style="width: 220px; height: 220px; background: #2563eb; opacity: 0.26; bottom: 80px; left: -100px"></div>

<ion-header class="vp-header">
  <vp-nav-bar [dark]="true" [compact]="true" defaultHref="/login" />
</ion-header>

<ion-content>
  <div class="auth__body auth__body--with-bar vp-dark">
    <div class="intro intro--tight">
      <h1 class="intro__title intro__title--sm">Start Your Journey</h1>
      <p class="intro__text">Create your account to unlock lessons, tutors and live classes.</p>
    </div>

    <form class="glass glass--reg" (ngSubmit)="register()" novalidate>
      <div>
        <h2 class="glass__title">Register</h2>
        <p class="glass__sub">Create your account</p>
      </div>

      <div class="avatar-pick">
        <button type="button" class="avatar-pick__btn" aria-label="Choose avatar photo" (click)="file.click()">
          @if (avatarPreview) {
            <img [src]="avatarPreview" alt="" />
          } @else {
            <vp-icon [d]="icons.user" [size]="38" [stroke]="1.8" />
          }
          <span class="avatar-pick__cam" aria-hidden="true"><vp-icon [d]="icons.camera" [size]="16" /></span>
        </button>
        <span class="avatar-pick__hint">{{ uploading ? 'Uploading...' : 'Tap to add a photo' }}</span>
        <input #file type="file" accept="image/*" class="hidden-file" (change)="onFileSelected($event)" />
      </div>

      <div class="vp-field">
        <label for="fn" class="vp-label">Full Name</label>
        <input id="fn" name="name" type="text" autocomplete="name" class="vp-input" [class.is-invalid]="submitted && !name" [(ngModel)]="name" />
      </div>
      <div class="vp-field">
        <label for="re" class="vp-label">Email</label>
        <input id="re" name="email" type="email" autocomplete="email" inputmode="email" class="vp-input" [class.is-invalid]="submitted && !email" [(ngModel)]="email" />
      </div>
      <div class="vp-field">
        <label for="co" class="vp-label">Country</label>
        <select id="co" name="country" class="vp-input" [(ngModel)]="country">
          <option value="">Select Country</option>
          @for (c of countries; track c) {
            <option [value]="c">{{ c }}</option>
          }
        </select>
      </div>
      <div class="vp-field">
        <label for="bio" class="vp-label">Bio</label>
        <textarea id="bio" name="bio" rows="3" class="vp-input" placeholder="Tell us about yourself" [(ngModel)]="bio"></textarea>
      </div>
      <div class="vp-field">
        <label for="p1" class="vp-label">Password</label>
        <input id="p1" name="password" type="password" autocomplete="new-password" class="vp-input" [class.is-invalid]="(submitted && !password) || passwordTooShort" [(ngModel)]="password" />
        @if (passwordTooShort) {
          <span class="vp-error-text">Password too short</span>
        }
      </div>
      <div class="vp-field">
        <label for="p2" class="vp-label">Confirm Password</label>
        <input id="p2" name="confirmPassword" type="password" autocomplete="new-password" class="vp-input" [class.is-invalid]="passwordMismatch" [(ngModel)]="confirmPassword" />
        @if (passwordMismatch) {
          <span class="vp-error-text">Passwords do not match</span>
        }
      </div>
      <label class="vp-check"><input type="checkbox" name="agree" [(ngModel)]="agree" />I agree to the terms</label>
      <button type="submit" class="vp-btn vp-btn--accent vp-btn--cta" [disabled]="loading || uploading">
        {{ loading ? 'Creating...' : 'Create Account' }}
      </button>
      <p class="switch">Already have an account? <a routerLink="/login" class="vp-link">Login</a></p>
    </form>
  </div>
</ion-content>
