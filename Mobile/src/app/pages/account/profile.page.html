<ion-header class="vp-header">
  <header class="vp-tab-header"><h1 class="vp-large-title me-title">Me</h1></header>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="load($any($event))"><ion-refresher-content /></ion-refresher>

  <div class="vp-scroll me-scroll">
    <!-- Thẻ hồ sơ -->
    <section class="vp-card vp-card--lg me-card">
      <button type="button" class="me-avatar" aria-label="Change avatar photo" [disabled]="uploading()" (click)="file.click()">
        <vp-avatar [name]="name()" [url]="avatar()" [size]="68" radius="22px" />
        <span class="me-avatar__cam" aria-hidden="true">
          @if (uploading()) {
            <span class="vp-spinner me-avatar__spin"></span>
          } @else {
            <vp-icon [d]="icons.camera" [size]="14" />
          }
        </span>
      </button>
      <input #file type="file" accept="image/*" hidden (change)="onAvatarSelected($event)" />
      <div class="vp-grow">
        <p class="me-name">{{ name() }}</p>
        <p class="me-meta">{{ email() }}@if (country()) { · {{ country() }}}</p>
        <span class="me-role">{{ roleLabel() }}</span>
      </div>
    </section>

    @if (isStudent()) {
      <a routerLink="/me/become-teacher" class="vp-btn vp-btn--orange me-become">Become a Teacher</a>
    }

    @for (g of groups(); track g.title) {
      <section class="me-group">
        <h2 class="me-group__title">{{ g.title }}</h2>
        <div class="me-list">
          @for (i of g.items; track i.label) {
            @if (i.link) {
              <a class="me-item" [routerLink]="i.link">
                <span class="me-item__icon"><vp-icon [d]="i.d" [size]="18" /></span>
                <span class="me-item__label">{{ i.label }}</span>
                <vp-icon class="me-item__chev" [d]="icons.chevronRight" [size]="18" />
              </a>
            } @else {
              <button type="button" class="me-item" [class.is-danger]="i.danger" (click)="i.action?.()">
                <span class="me-item__icon"><vp-icon [d]="i.d" [size]="18" /></span>
                <span class="me-item__label">{{ i.label }}</span>
                <vp-icon class="me-item__chev" [d]="icons.chevronRight" [size]="18" />
              </button>
            }
          }
        </div>
      </section>
    }
  </div>
</ion-content>
