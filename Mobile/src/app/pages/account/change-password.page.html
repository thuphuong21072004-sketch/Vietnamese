<ion-header class="vp-header">
  <vp-nav-bar title="Change Password" [defaultHref]="meHref" />
</ion-header>

<ion-content>
  <div class="vp-scroll af-scroll">
    <div class="vp-alert vp-alert--info af-intro">Use at least 6 characters for your new password.</div>

    <form class="af-card" (ngSubmit)="save()" novalidate>
      <div class="vp-field">
        <label for="op" class="vp-label">Old Password</label>
        <input id="op" name="oldPassword" type="password" autocomplete="current-password" class="vp-input" [class.is-invalid]="submitted && !oldPassword" [(ngModel)]="oldPassword" />
      </div>
      <div class="vp-field">
        <label for="np" class="vp-label">New Password</label>
        <input id="np" name="newPassword" type="password" autocomplete="new-password" class="vp-input" [class.is-invalid]="(submitted && !newPassword) || tooShort" [(ngModel)]="newPassword" />
        @if (tooShort) {
          <span class="vp-error-text">Password must be at least 6 characters</span>
        }
      </div>
      <div class="vp-field">
        <label for="cp" class="vp-label">Confirm Password</label>
        <input id="cp" name="confirmPassword" type="password" autocomplete="new-password" class="vp-input" [class.is-invalid]="(submitted && !confirmPassword) || mismatch" [(ngModel)]="confirmPassword" />
        @if (mismatch) {
          <span class="vp-error-text">Passwords do not match</span>
        }
      </div>
      <button type="submit" hidden></button>
    </form>
  </div>
</ion-content>

<ion-footer class="vp-footer">
  <div class="vp-bottom-bar">
    <button type="button" class="vp-btn vp-btn--primary vp-btn--cta" [disabled]="saving" (click)="save()">
      {{ saving ? 'Saving...' : 'Change Password' }}
    </button>
  </div>
</ion-footer>
